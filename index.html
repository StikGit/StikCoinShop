<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StikCoin Accessory Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>StikCoin Shop</h1>
        <div id="auth-section">
            <button id="login-btn" onclick="loginWithTwitch()">Login with Twitch</button>
            <span id="user-info" class="hidden">
                Welcome, <strong id="username">Viewer</strong>! 
                🪙 Balance: <span id="balance">0</span> StikCoins
            </span>
        </div>
    </header>

    <main>
        <section class="shop-grid">
            <!-- Item 1 -->
            <div class="shop-item" data-id="hat_01" data-price="50">
                <div class="item-image">🎩</div>
                <h3>Fancy Top Hat</h3>
                <p class="price">50 StikCoins</p>
                <button class="buy-btn" onclick="purchaseItem('hat_01', 50)" disabled>Buy Now</button>
            </div>

            <!-- Item 2 -->
            <div class="shop-item" data-id="shades_01" data-price="30">
                <div class="item-image">😎</div>
                <h3>Cool Sunglasses</h3>
                <p class="price">30 StikCoins</p>
                <button class="buy-btn" onclick="purchaseItem('shades_01', 30)" disabled>Buy Now</button>
            </div>
        </section>
    </main>

    <script>
        // CONFIGURATION VARIABLES (Update these with your actual values)
        const TWITCH_CLIENT_ID = '[REDACTED]';
        const TUNNEL_URL = 'http://localhost:7472';
        const REDIRECT_URI = 'https://stikgit.github.io/StikCoinShop/';

        let twitchUsername = "";
        let twitchUserId = "";
        let accessToken = "";
        let stikCoinCurrencyId = null;

        // 1. Handle Twitch Login Redirect
        function loginWithTwitch() {
            const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=user:read:email`;
            window.location.href = authUrl;
        }

        // 2. Parse URL to check if user just logged in
        function checkAuth() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            accessToken = params.get('access_token');

            if (accessToken) {
                // Clear token from URL bar for cleanliness
                window.location.hash = '';
                fetchTwitchUserData();
            }
        }

        // 3. Get Username and User ID from Twitch using token
        async function fetchTwitchUserData() {
            try {
                const response = await fetch('https://api.twitch.tv/helix/users', {
                    headers: {
                        'Client-ID': TWITCH_CLIENT_ID,
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    twitchUsername = data.data[0].login;
                    twitchUserId = data.data[0].id;
                    document.getElementById('username').innerText = data.data[0].display_name;
                    console.log('Twitch User ID:', twitchUserId);
                    document.getElementById('login-btn').classList.add('hidden');
                    document.getElementById('user-info').classList.remove('hidden');
                    
                    // Enable buy buttons and fetch coin balance from Firebot
                    fetchBalance();
                }
            } catch (err) {
                console.error("Twitch auth failed:", err);
            }
        }

        // 4. Get StikCoin Currency ID from Firebot
        async function getStikCoinCurrencyId() {
            if (!TUNNEL_URL || TUNNEL_URL.includes('YOUR_')) {
                console.log('TUNNEL_URL not set or still has placeholder');
                return null;
            }
            try {
                const response = await fetch(`${TUNNEL_URL}/api/v1/currency/StikCoin`);
                if (!response.ok) {
                    throw new Error('StikCoin currency not found in Firebot');
                }
                const data = await response.json();
                stikCoinCurrencyId = data.id;
                console.log('StikCoin Currency ID:', stikCoinCurrencyId);
                return stikCoinCurrencyId;
            } catch (err) {
                console.error('Error fetching currency ID:', err);
                return null;
            }
        }

        // 5. Fetch StikCoin Balance from local Firebot
        async function fetchBalance() {
            if (!TUNNEL_URL || TUNNEL_URL.includes('YOUR_')) {
                console.log('TUNNEL_URL not set or still has placeholder');
                return;
            }
            try {
                // Ensure we have the currency ID
                if (!stikCoinCurrencyId) {
                    await getStikCoinCurrencyId();
                }
                
                if (!stikCoinCurrencyId) {
                    throw new Error('Could not get StikCoin currency ID');
                }
                
                // Fetch balance using currency API with username parameter
                const response = await fetch(`${TUNNEL_URL}/api/v1/viewers/${twitchUsername}/currency/${stikCoinCurrencyId}?username=true`);
                const coins = await response.json();
                
                console.log('StikCoin balance:', coins);
                document.getElementById('balance').innerText = coins;
                
                // Unlock checkout buttons
                document.querySelectorAll('.buy-btn').forEach(btn => btn.disabled = false);
            } catch (err) {
                console.error('Balance fetch error:', err);
                alert("Could not connect to the stream shop system. Streamer might be offline!");
            }
        }

        // 6. Send Purchase Request to Firebot API - Deduct from Currency
        async function purchaseItem(itemId, itemPrice) {
            const currentBalance = parseInt(document.getElementById('balance').innerText);
            if (currentBalance < itemPrice) {
                alert("You do not have enough StikCoins!");
                return;
            }

            if (!stikCoinCurrencyId) {
                alert("Currency system not initialized. Please refresh and try again.");
                return;
            }

            try {
                // Deduct coins from user's currency
                const newBalance = currentBalance - itemPrice;
                const response = await fetch(`${TUNNEL_URL}/api/v1/viewers/${twitchUsername}/currency/${stikCoinCurrencyId}?username=true`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: newBalance,
                        setAmount: true
                    })
                });

                if (response.ok) {
                    alert(`Purchase successful! You bought ${itemId}. New balance: ${newBalance} StikCoins`);
                    document.getElementById('balance').innerText = newBalance;
                } else {
                    alert("Purchase failed. The shop may be locked right now.");
                    fetchBalance(); // Refresh to get actual balance
                }
            } catch (err) {
                console.error('Purchase error:', err);
                alert("Connection error trying to submit order.");
            }
        }

        // Run checking logic immediately when webpage loads
        window.onload = () => {
            checkAuth();
            // Preload currency ID if possible
            getStikCoinCurrencyId().catch(() => console.log('Currency ID will be fetched on login'));
        };
    
    </script>

</body>
</html>
